[project]
name = "wxvideo"
version = "0.1.0"
description = "微信视频号下载器：内嵌 mitmproxy 抓包 + 纯 Python ISAAC64 解密，pywebview 图形界面"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mitmproxy>=12",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pydantic",
    "pywebview",
    "cryptography",
]

[project.scripts]
wxvideo = "wxvideo_core.cli:main"

[tool.setuptools]
package-dir = { "" = "core" }
packages = ["wxvideo_core"]
